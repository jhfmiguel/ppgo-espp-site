apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: espp-app
  namespace: espp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: espp-app
  minReplicas: 2
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: espp-api
  namespace: espp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: espp-api
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: espp-app
  namespace: espp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: espp-app
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: espp-api
  namespace: espp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: espp-api
