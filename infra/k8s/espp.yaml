apiVersion: v1
kind: Namespace
metadata:
  name: espp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: espp-config
  namespace: espp
data:
  ESPP_API_PORT: "8081"
  ESPP_DB_SCHEMA: "ESPP"
  ESPP_AUTH_MODE: "ssp"
  ESPP_FRONTEND_URL: "https://espp.exemplo.go.gov.br"
  ESPP_ATTACHMENTS_DIR: "/data/espp/attachments"
  ESPP_MAIL_PORT: "587"
  ESPP_API_URL: "http://espp-api:8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: espp-secrets
  namespace: espp
type: Opaque
stringData:
  ESPP_DB_URL: "jdbc:oracle:thin:@//oracle.exemplo.interno:1521/SERVICO"
  ESPP_DB_USERNAME: "ESPP"
  ESPP_DB_PASSWORD: "ALTERAR"
  ESPP_CONFIG_ENCRYPTION_KEY: "ALTERAR"
  ESPP_MAIL_HOST: "ALTERAR"
  ESPP_MAIL_USERNAME: "ALTERAR"
  ESPP_MAIL_PASSWORD: "ALTERAR"
  ESPP_MAIL_TO: "ALTERAR"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: espp-attachments
  namespace: espp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espp-api
  namespace: espp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: espp-api
  template:
    metadata:
      labels:
        app: espp-api
    spec:
      containers:
        - name: api
          image: REGISTRY/ppgo-espp-api:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: espp-config
            - secretRef:
                name: espp-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: attachments
              mountPath: /data/espp/attachments
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: espp-attachments
---
apiVersion: v1
kind: Service
metadata:
  name: espp-api
  namespace: espp
spec:
  selector:
    app: espp-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espp-app
  namespace: espp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: espp-app
  template:
    metadata:
      labels:
        app: espp-app
    spec:
      containers:
        - name: app
          image: REGISTRY/ppgo-espp-app:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: ESPP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: espp-config
                  key: ESPP_API_URL
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: espp-app
  namespace: espp
spec:
  selector:
    app: espp-app
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP
