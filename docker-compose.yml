services:
  api:
    build:
      context: ./api
    image: ppgo-espp-api:local
    container_name: ppgo-espp-api
    restart: unless-stopped
    environment:
      ESPP_API_PORT: 8081
      ESPP_DB_URL: jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1
      ESPP_DB_USERNAME: ESPP
      ESPP_DB_PASSWORD: ${ESPP_DB_PASSWORD:-espp}
      ESPP_DB_SCHEMA: ESPP
      ESPP_AUTH_MODE: ${ESPP_AUTH_MODE:-development}
      ESPP_FRONTEND_URL: http://localhost:3001
      ESPP_CONFIG_ENCRYPTION_KEY: ${ESPP_CONFIG_ENCRYPTION_KEY:-espp-local-docker-development-key-2026}
      ESPP_ATTACHMENTS_DIR: /data/espp/attachments
      ESPP_MAIL_HOST: ${ESPP_MAIL_HOST:-smtp.gmail.com}
      ESPP_MAIL_PORT: ${ESPP_MAIL_PORT:-587}
      ESPP_MAIL_USERNAME: ${ESPP_MAIL_USERNAME:-}
      ESPP_MAIL_PASSWORD: ${ESPP_MAIL_PASSWORD:-}
      ESPP_MAIL_TO: ${ESPP_MAIL_TO:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - espp-attachments:/data/espp/attachments
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: ./app
    image: ppgo-espp-app:local
    container_name: ppgo-espp-app
    restart: unless-stopped
    environment:
      ESPP_API_URL: http://api:8081
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"

volumes:
  espp-attachments:
