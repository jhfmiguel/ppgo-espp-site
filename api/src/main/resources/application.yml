server:
  port: ${ESPP_API_PORT:8081}

spring:
  application:
    name: ppgo-espp-api
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ESPP_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ESPP_DB_USERNAME:ESPP}
    password: ${ESPP_DB_PASSWORD:espp}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${ESPP_DB_SCHEMA:ESPP}
        jdbc:
          fetch_size: ${ESPP_JDBC_FETCH_SIZE:50}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${ESPP_DB_SCHEMA:ESPP}
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 25MB
  mail:
    host: ${ESPP_MAIL_HOST:smtp.gmail.com}
    port: ${ESPP_MAIL_PORT:587}
    username: ${ESPP_MAIL_USERNAME:}
    password: ${ESPP_MAIL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health

espp:
  config:
    encryption-key: ${ESPP_CONFIG_ENCRYPTION_KEY:}
  contato:
    destinatario: ${ESPP_MAIL_TO:}

app:
  auth:
    # development mantém o ambiente local funcional enquanto a SSP-GO não fornece
    # o contrato/token real. Em homologação/produção configure ESPP_AUTH_MODE=ssp.
    mode: ${ESPP_AUTH_MODE:development}
  frontend-url: ${ESPP_FRONTEND_URL:http://localhost:3001}
  storage:
    attachments-dir: ${ESPP_ATTACHMENTS_DIR:C:/workspace/ppgo/espp/site-institucional/storage/mensagens}
