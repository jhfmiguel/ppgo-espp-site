server:
  port: ${ESPP_API_PORT:8081}

spring:
  application:
    name: ppgo-espp-api

  datasource:
    url: ${ESPP_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ESPP_DB_USERNAME:ESPP}
    password: ${ESPP_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    mode: ${ESPP_AUTH_MODE:local}

  frontend-url: ${ESPP_FRONTEND_URL:http://localhost:3001}

  admin:
    user: ${ESPP_ADMIN_USER:admin}
    password: ${ESPP_ADMIN_PASSWORD}

  mail:
    enabled: ${ESPP_MAIL_ENABLED:false}
    tenant-id: ${ESPP_MAIL_TENANT_ID:}
    client-id: ${ESPP_MAIL_CLIENT_ID:}
    client-secret: ${ESPP_MAIL_CLIENT_SECRET:}
    from: ${ESPP_MAIL_FROM:}

  storage:
    attachments-dir: ${ESPP_ATTACHMENTS_DIR:C:/workspace/ppgo/espp/site-insitucional/storage/mensagens}