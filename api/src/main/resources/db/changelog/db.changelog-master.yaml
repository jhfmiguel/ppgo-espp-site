databaseChangeLog:
  - changeSet:
      id: 001
      author: ppgo
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE ESPP_NOTICIA (ID VARCHAR2(36) PRIMARY KEY, SLUG VARCHAR2(120) NOT NULL UNIQUE, TITULO VARCHAR2(250) NOT NULL, DATA_PUBLICACAO DATE NOT NULL, CATEGORIA VARCHAR2(100) NOT NULL, RESUMO VARCHAR2(1000) NOT NULL, CONTEUDO CLOB NOT NULL, IMAGEM_URL VARCHAR2(1000), IMAGEM_ALT VARCHAR2(300), STATUS VARCHAR2(20) NOT NULL, AUTOR VARCHAR2(150) NOT NULL, CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL, ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE INDEX IX_NOTICIA_STATUS_DATA ON ESPP_NOTICIA(STATUS, DATA_PUBLICACAO);
              CREATE TABLE ESPP_EVENTO (ID VARCHAR2(36) PRIMARY KEY, SLUG VARCHAR2(120) NOT NULL UNIQUE, TITULO VARCHAR2(250) NOT NULL, DATA_INICIO DATE NOT NULL, DATA_FIM DATE, HORARIO VARCHAR2(100), LOCAL_EVENTO VARCHAR2(300), MODALIDADE VARCHAR2(20) NOT NULL, CATEGORIA VARCHAR2(100) NOT NULL, RESUMO VARCHAR2(1000) NOT NULL, CONTEUDO CLOB NOT NULL, IMAGEM_URL VARCHAR2(1000), IMAGEM_ALT VARCHAR2(300), INSCRICAO_HREF VARCHAR2(1000), STATUS VARCHAR2(20) NOT NULL, AUTOR VARCHAR2(150) NOT NULL, CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL, ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ESPP_ATO_NORMATIVO (ID VARCHAR2(36) PRIMARY KEY, TIPO VARCHAR2(100) NOT NULL, NUMERO VARCHAR2(100) NOT NULL, TITULO VARCHAR2(300) NOT NULL, EMENTA VARCHAR2(2000) NOT NULL, SITUACAO VARCHAR2(20) NOT NULL, ANO NUMBER(4) NOT NULL, DATA_ATO DATE NOT NULL, HREF VARCHAR2(1000), ANEXO_NOME VARCHAR2(300), ANEXO_URL VARCHAR2(1000), ANEXO_TAMANHO NUMBER(19), STATUS VARCHAR2(20) NOT NULL, AUTOR VARCHAR2(150) NOT NULL, CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL, ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
  - changeSet:
      id: 002-autorizacao-painel
      author: ppgo
      changes:
        - sql:
            sql: |
              CREATE TABLE ESPP_USUARIO_AUTORIZADO (ID VARCHAR2(36) PRIMARY KEY, IDENTIFICADOR_INSTITUCIONAL VARCHAR2(200) NOT NULL UNIQUE, NOME VARCHAR2(200), PERFIL VARCHAR2(30) NOT NULL, ATIVO NUMBER(1) DEFAULT 1 NOT NULL, CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL, ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
  - changeSet:
      id: 003-comunicacao
      author: ppgo
      changes:
        - sql:
            sql: |
              CREATE TABLE ESPP_MENSAGEM_CONTATO (ID VARCHAR2(36) PRIMARY KEY,NOME VARCHAR2(200) NOT NULL,EMAIL VARCHAR2(320) NOT NULL,TELEFONE VARCHAR2(40),ASSUNTO VARCHAR2(250) NOT NULL,MENSAGEM CLOB NOT NULL,STATUS VARCHAR2(30) NOT NULL,RESPONSAVEL VARCHAR2(200),RESPOSTA CLOB,RESPONDIDO_EM TIMESTAMP WITH TIME ZONE,CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL,ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
              CREATE TABLE ESPP_NEWSLETTER_ASSINANTE (ID VARCHAR2(36) PRIMARY KEY,EMAIL VARCHAR2(320) NOT NULL UNIQUE,NOME VARCHAR2(200),ATIVO NUMBER(1) DEFAULT 1 NOT NULL,ORIGEM VARCHAR2(100) NOT NULL,CONSENTIDO_EM TIMESTAMP WITH TIME ZONE NOT NULL,CANCELADO_EM TIMESTAMP WITH TIME ZONE,CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL,ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
  - changeSet:
      id: 004-newsletter-boolean
      author: ppgo
      changes:
        - sql:
            sql: |
              ALTER TABLE ESPP_NEWSLETTER_ASSINANTE ADD ATIVO_BOOLEAN BOOLEAN;
              UPDATE ESPP_NEWSLETTER_ASSINANTE SET ATIVO_BOOLEAN=CASE WHEN ATIVO=1 THEN TRUE ELSE FALSE END;
              ALTER TABLE ESPP_NEWSLETTER_ASSINANTE DROP COLUMN ATIVO;
              ALTER TABLE ESPP_NEWSLETTER_ASSINANTE RENAME COLUMN ATIVO_BOOLEAN TO ATIVO;
  - changeSet:
      id: 005a-comunicacao-protocolo
      author: ppgo
      preConditions:
        - onFail: MARK_RAN
        - not: [{columnExists: {tableName: ESPP_MENSAGEM_CONTATO, columnName: PROTOCOLO}}]
      changes:
        - sql:
            sql: |
              ALTER TABLE ESPP_MENSAGEM_CONTATO ADD PROTOCOLO VARCHAR2(30);
              UPDATE ESPP_MENSAGEM_CONTATO SET PROTOCOLO='ESPP-LEGADO-'||SUBSTR(REPLACE(ID,'-',''),1,12) WHERE PROTOCOLO IS NULL;
              ALTER TABLE ESPP_MENSAGEM_CONTATO MODIFY PROTOCOLO NOT NULL;
  - changeSet:
      id: 009-auditoria-alteracoes
      author: ppgo
      preConditions:
        - onFail: MARK_RAN
        - not: [{tableExists: {tableName: ESPP_AUDITORIA_ALTERACAO}}]
      changes:
        - sql:
            sql: |
              CREATE TABLE ESPP_AUDITORIA_ALTERACAO (ID VARCHAR2(36) PRIMARY KEY,MODULO VARCHAR2(50) NOT NULL,ACAO VARCHAR2(30) NOT NULL,ENTIDADE_ID VARCHAR2(36),TITULO VARCHAR2(300),USUARIO VARCHAR2(200) NOT NULL,DADOS_ANTES CLOB,DADOS_DEPOIS CLOB,CRIADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
  - changeSet:
      id: 010-configuracao-email-smtp
      author: ppgo
      preConditions:
        - onFail: MARK_RAN
        - not: [{tableExists: {tableName: ESPP_CONFIGURACAO_EMAIL}}]
      changes:
        - sql:
            sql: |
              CREATE TABLE ESPP_CONFIGURACAO_EMAIL (ID NUMBER(19) PRIMARY KEY,HOST VARCHAR2(255) NOT NULL,PORTA NUMBER(5) NOT NULL,REMETENTE VARCHAR2(320) NOT NULL,DESTINATARIO VARCHAR2(320) NOT NULL,SENHA_CRIPTOGRAFADA VARCHAR2(2048) NOT NULL,AUTENTICACAO NUMBER(1) DEFAULT 1 NOT NULL,STARTTLS NUMBER(1) DEFAULT 1 NOT NULL,ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL);
  - changeSet:
      id: 011-identidade-visual
      author: ppgo
      preConditions:
        - onFail: MARK_RAN
        - not: [{tableExists: {tableName: ESPP_IDENTIDADE_VISUAL}}]
      changes:
        - sql:
            sql: |
              CREATE TABLE ESPP_IDENTIDADE_VISUAL (CHAVE VARCHAR2(40) PRIMARY KEY,CONTEUDO BLOB NOT NULL,CONTENT_TYPE VARCHAR2(60) NOT NULL,ATUALIZADO_EM TIMESTAMP WITH TIME ZONE NOT NULL,ATUALIZADO_POR VARCHAR2(160));
