server.port=${ESPP_API_PORT:8081}

spring.application.name=ppgo-espp-api
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.url=${ESPP_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ESPP_DB_USERNAME:ESPP}
spring.datasource.password=${ESPP_DB_PASSWORD:espp}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${ESPP_DB_SCHEMA:ESPP}
spring.jpa.properties.hibernate.jdbc.fetch_size=${ESPP_JDBC_FETCH_SIZE:50}

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${ESPP_DB_SCHEMA:ESPP}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=25MB

spring.mail.host=${ESPP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${ESPP_MAIL_PORT:587}
spring.mail.username=${ESPP_MAIL_USERNAME:}
spring.mail.password=${ESPP_MAIL_PASSWORD:}

management.endpoints.web.exposure.include=health

espp.config.encryption-key=${ESPP_CONFIG_ENCRYPTION_KEY:}
espp.contato.destinatario=${ESPP_MAIL_TO:}

# development mantém o ambiente local funcional enquanto a SSP-GO não fornece
# o contrato/token real. Em homologação/produção configure ESPP_AUTH_MODE=ssp.
app.auth.mode=${ESPP_AUTH_MODE:development}
app.frontend-url=${ESPP_FRONTEND_URL:http://localhost:3001}
app.storage.attachments-dir=${ESPP_ATTACHMENTS_DIR:C:/workspace/ppgo/espp/site-institucional/storage/mensagens}
